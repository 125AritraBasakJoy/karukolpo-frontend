<header class="site-header">
  <div class="header-container flex align-items-center">
    <!-- Brand Logo Area -->
    <a class="brand-link flex align-items-center cursor-pointer text-decoration-none" routerLink="/" (click)="closeAllMenus()" aria-label="Karukolpo Home">
      <img ngSrc="assets/header-logo.webp" alt="Karukolpo" class="brand-logo" width="505" height="422" priority />
    </a>

    <!-- Desktop Center Navigation -->
    <nav class="desktop-nav hidden lg:flex align-items-center">
      <!-- Home Link -->
      <a routerLink="/" class="nav-link" (click)="closeAllMenus()">Home</a>

      <!-- Shop Dropdown -->
      <div class="nav-dropdown-wrapper relative">
        <button type="button" class="nav-item-btn flex align-items-center gap-1" (click)="toggleShopMenu($event)">
          <span>Shop</span>
          <i class="pi pi-chevron-down text-xs chevron" [class.rotate-180]="isShopMenuOpen()"></i>
        </button>
        <div class="dropdown-menu-card" *ngIf="isShopMenuOpen()">
          <a routerLink="/all-products" class="dropdown-item" (click)="closeAllMenus()">
            <i class="pi pi-th-large mr-2"></i> All Products
          </a>
          <a routerLink="/all-products" [queryParams]="{ filter: 'best-selling' }" class="dropdown-item" (click)="closeAllMenus()">
            <i class="pi pi-star mr-2"></i> Best Sellers
          </a>
          <a routerLink="/all-products" [queryParams]="{ filter: 'hot-deals' }" class="dropdown-item" (click)="closeAllMenus()">
            <i class="pi pi-bolt mr-2"></i> Hot Deals
          </a>
        </div>
      </div>

      <!-- Collections / Categories Dropdown -->
      <div class="nav-dropdown-wrapper relative">
        <button type="button" class="nav-item-btn flex align-items-center gap-1" (click)="toggleCollectionsMenu($event)">
          <span>Collections</span>
          <i class="pi pi-chevron-down text-xs chevron" [class.rotate-180]="isCollectionsMenuOpen()"></i>
        </button>
        <div class="dropdown-menu-card collections-menu" *ngIf="isCollectionsMenuOpen()">
          <a routerLink="/all-products" class="dropdown-item font-semibold border-bottom-1 surface-border mb-1" (click)="closeAllMenus()">
            All Collections
          </a>
          <a *ngFor="let cat of categoryService.categories()" [routerLink]="['/category', cat.slug || cat.id]" class="dropdown-item" (click)="closeAllMenus()">
            {{ cat.name }}
          </a>
        </div>
      </div>

      <!-- Our Story -->
      <a routerLink="/about" class="nav-link" (click)="closeAllMenus()">Our Story</a>
    </nav>

    <!-- Search Input Pill (Desktop & Tablet) -->
    <div class="header-search-wrapper hidden md:flex align-items-center">
      <form (submit)="onSearchSubmit(); $event.preventDefault();" class="search-form w-full flex align-items-center">
        <i class="pi pi-search search-icon" (click)="onSearchSubmit()"></i>
        <input type="text" [(ngModel)]="searchQuery" name="searchQuery"
               placeholder="Search for handmade crafts..."
               class="search-input" />
      </form>
    </div>

    <!-- Right Actions Group -->
    <div class="header-actions flex align-items-center">
      <!-- Track Order Button -->
      <a routerLink="/track-order" class="track-order-btn hidden sm:flex align-items-center text-decoration-none">
        <i class="pi pi-box track-icon"></i>
        <span>Track Order</span>
      </a>

      <!-- Cart Button with Terracotta Pill Badge -->
      <button type="button" class="header-cart-btn relative flex align-items-center justify-content-center"
              (click)="openCart()" aria-label="Shopping Cart">
        <i class="pi pi-shopping-bag"></i>
        <span class="cart-pill-badge" *ngIf="cartService.totalItems() >= 0">
          {{ cartService.totalItems() }}
        </span>
      </button>

      <!-- Mobile Hamburger Menu Button -->
      <button type="button" class="mobile-menu-toggle lg:hidden flex align-items-center justify-content-center"
              (click)="toggleMobileMenu()" aria-label="Toggle menu">
        <i class="pi" [ngClass]="isMobileMenuOpen() ? 'pi-times' : 'pi-bars'"></i>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer Menu (Right to Left, Full Length) -->
  <p-drawer [visible]="isMobileMenuOpen()" (visibleChange)="isMobileMenuOpen.set($event)"
            position="right" [modal]="true" [dismissible]="true" [closeOnEscape]="true" [blockScroll]="true"
            styleClass="mobile-nav-p-drawer lg:hidden" appendTo="body" (onHide)="closeAllMenus()">
    <ng-template pTemplate="header">
      <div class="flex align-items-center justify-content-between w-full pr-2">
        <a routerLink="/" (click)="closeAllMenus()" class="flex align-items-center text-decoration-none">
          <img ngSrc="assets/header-logo.webp" alt="Karukolpo" width="140" height="40" class="mobile-drawer-logo" />
        </a>
      </div>
    </ng-template>

    <div class="mobile-drawer-body">
      <!-- Search Box inside Drawer -->
      <div class="mobile-search-box pb-3 mb-2 border-bottom-1 surface-border">
        <form (submit)="onSearchSubmit(); $event.preventDefault();" class="search-form flex align-items-center w-full">
          <i class="pi pi-search search-icon" (click)="onSearchSubmit()"></i>
          <input type="text" [(ngModel)]="searchQuery" name="searchQueryMobile"
                 placeholder="Search for handmade crafts..." class="search-input w-full" />
        </form>
      </div>

      <!-- Navigation Links -->
      <div class="mobile-nav-links flex flex-column gap-1">
        <a routerLink="/" class="mobile-nav-link" (click)="closeAllMenus()">
          <i class="pi pi-home mr-2"></i> Home
        </a>
        <a routerLink="/all-products" class="mobile-nav-link" (click)="closeAllMenus()">
          <i class="pi pi-th-large mr-2"></i> All Products
        </a>

        <!-- Categories Section with Expand/Collapse Header Button -->
        <button type="button" class="mobile-section-header-btn flex align-items-center justify-content-between w-full mt-3 p-link"
                (click)="toggleCategoriesSection()" [attr.aria-expanded]="isCategoriesSectionExpanded()">
          <span class="mobile-section-header-title">Categories</span>
          <i class="pi pi-chevron-down section-chevron text-xs" [class.rotate-180]="isCategoriesSectionExpanded()"></i>
        </button>

        <div class="mobile-categories-list flex flex-column gap-1 pl-1" *ngIf="isCategoriesSectionExpanded()">
          <div *ngFor="let cat of categoryService.categories()" class="mobile-category-item">
            <!-- Category Header row -->
            <div class="flex align-items-center justify-content-between mobile-cat-row">
              <a [routerLink]="['/category', cat.slug || cat.id]" class="mobile-nav-link flex-1" (click)="closeAllMenus()">
                <i class="pi pi-tag mr-2 text-primary"></i>
                <span>{{ cat.name }}</span>
              </a>
              <button *ngIf="cat.children && cat.children.length > 0" type="button"
                      class="cat-expand-btn p-link flex align-items-center justify-content-center"
                      (click)="toggleCategoryExpand(cat.id, $event)"
                      [attr.aria-label]="'Toggle subcategories for ' + cat.name">
                <i class="pi pi-chevron-down expand-icon" [class.rotate-180]="isCategoryExpanded(cat.id)"></i>
              </button>
            </div>

            <!-- Expandable Subcategories / Children Menu -->
            <div *ngIf="cat.children && cat.children.length > 0 && isCategoryExpanded(cat.id)" class="mobile-subcat-list pl-4 py-1 flex flex-column gap-1">
              <a *ngFor="let child of cat.children"
                 [routerLink]="['/category', child.slug || child.id]"
                 class="mobile-subcat-link"
                 (click)="closeAllMenus()">
                <i class="pi pi-angle-right mr-1 text-xs"></i>
                <span>{{ child.name }}</span>
              </a>
            </div>
          </div>
        </div>

        <!-- Discover Section -->
        <div class="mobile-section-header mt-3">Discover</div>
        <a routerLink="/all-products" [queryParams]="{ filter: 'best-selling' }" class="mobile-nav-link" (click)="closeAllMenus()">
          <i class="pi pi-star mr-2"></i> Best Sellers
        </a>
        <a routerLink="/all-products" [queryParams]="{ filter: 'hot-deals' }" class="mobile-nav-link" (click)="closeAllMenus()">
          <i class="pi pi-bolt mr-2"></i> Hot Deals
        </a>
        <a routerLink="/about" class="mobile-nav-link" (click)="closeAllMenus()">
          <i class="pi pi-book mr-2"></i> Our Story
        </a>
        <a routerLink="/track-order" class="mobile-nav-link" (click)="closeAllMenus()">
          <i class="pi pi-box mr-2"></i> Track Order
        </a>
      </div>
    </div>
  </p-drawer>
</header>
