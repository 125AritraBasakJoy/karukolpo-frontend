<p-toast></p-toast>

<div class="combos-listing-page py-5 sm:py-6 px-3 sm:px-4 min-h-screen">
  <div class="container max-w-7xl mx-auto">
    <!-- Breadcrumb & Header -->
    <div class="mb-4">
      <a routerLink="/" class="text-xs text-500 hover:text-primary mb-2 inline-block">
        <i class="pi pi-arrow-left text-xs mr-1"></i> Back to Home
      </a>
      <span class="section-kicker block mb-1">Better Together</span>
      <h1 class="section-heading text-3xl sm:text-4xl m-0 font-bold">Combo Offers & Bundles</h1>
      <p class="text-600 m-0 mt-2 text-sm sm:text-base max-w-30rem">
        Special curated sets, multipacks and mix-and-match bundles with built-in savings.
      </p>
    </div>

    <!-- Skeleton Loading Grid -->
    <div *ngIf="loading()" class="grid">
      <div *ngFor="let i of [1,2,3,4,5,6]" class="col-12 sm:col-6 lg:col-4 p-2">
        <div class="p-4 border-round-2xl surface-card border-1 surface-border">
          <p-skeleton width="40%" height="1rem" styleClass="mb-3"></p-skeleton>
          <p-skeleton width="100%" height="80px" borderRadius="12px" styleClass="mb-3"></p-skeleton>
          <p-skeleton width="80%" height="1.5rem" styleClass="mb-2"></p-skeleton>
          <p-skeleton width="50%" height="1.8rem"></p-skeleton>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading() && combos().length === 0" class="py-8 text-center surface-card border-round-2xl border-1 surface-border">
      <i class="pi pi-shopping-bag text-5xl text-400 mb-3 block"></i>
      <h3 class="text-xl font-bold text-900 m-0">No active combo offers right now</h3>
      <p class="text-600 text-sm mt-2 mb-4">Check back soon for new curated artisanal deals.</p>
      <a routerLink="/all-products" class="btn-browse-products inline-flex align-items-center gap-2 px-4 py-2 border-round-xl text-white font-semibold">
        <span>Browse All Products</span>
        <i class="pi pi-arrow-right text-xs"></i>
      </a>
    </div>

    <!-- Combos Grid -->
    <div *ngIf="!loading() && combos().length > 0" class="grid">
      <div *ngFor="let combo of combos()" class="col-12 sm:col-6 lg:col-4 p-2">
        <app-combo-card
          [combo]="combo"
          (addCombo)="onAddCombo($event)"
          (configure)="onConfigureCombo($event)">
        </app-combo-card>
      </div>
    </div>
  </div>
</div>

<app-bundle-picker
  [combo]="selectedMixCombo()"
  [(visible)]="mixPickerVisible"
  (picksConfirmed)="onPicksConfirmed($event)">
</app-bundle-picker>
