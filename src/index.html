<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Karukolpo | Authentic Bangladeshi Handcrafts</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script>
    // Prevent browser PWA install pop-ups automatically
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-beforeinstallprompt', { detail: e }));
    });
  </script>
  <meta name="description" content="Discover Karukolpo: Premium Bangladeshi handcrafted heritage products, home decor, and authentic artisan creations. Support local craftsmen and find unique gifts.">
  <meta name="keywords" content="handicrafts, Bangladesh crafts, home decor, artisan products, handmade jewelry, Karukolpo, traditional crafts">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://karukolpo.com/">
  <meta property="og:title" content="Karukolpo | Authentic Bangladeshi Handcrafts">
  <meta property="og:description" content="Premium Bangladeshi handcrafted products and heritage-inspired home decor.">
  <meta property="og:image" content="https://karukolpo.com/assets/hero-banner.webp">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://karukolpo.com/">
  <meta property="twitter:title" content="Karukolpo | Authentic Bangladeshi Handcrafts">
  <meta property="twitter:description" content="Premium Bangladeshi handcrafted products and heritage-inspired home decor.">
  <meta property="twitter:image" content="https://karukolpo.com/assets/hero-banner.webp">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://karukolpo.com/"/>

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">

  <!-- Synchronously check cached site notice to prevent layout shift (CLS) -->
  <script>
    try {
      var n = localStorage.getItem('karukolpo_site_notices');
      if (n) {
        var p = JSON.parse(n);
        if (Array.isArray(p) && p.length > 0) {
          document.documentElement.style.setProperty('--site-notice-h', '40px');
        }
      }
    } catch(e) {}
  </script>

  <!-- Preload Critical Above-The-Fold Assets -->
  <link rel="preload" as="image" href="assets/header-logo.webp" type="image/webp" fetchpriority="high">
  <link rel="preload" as="image" href="assets/hero-banner.webp" type="image/webp" media="(min-width: 769px)" fetchpriority="high">
  <link rel="preload" as="image" href="assets/hero-banner-mobile.webp" type="image/webp" media="(max-width: 768px)" fetchpriority="high">

  <!-- Inline Critical CSS: Zero-flicker shell -->
  <style>
    :root { --accent-color: #B84E29; --surface-card: #FFFFFF; }
    body { margin: 0; background: #FAF7F2; font-family: 'Inter', 'Noto Sans Bengali', -apple-system, BlinkMacSystemFont, sans-serif; }
    .header-shell { height: 75px; background: #FFFFFF; border-bottom: 1px solid #ECE7E0; display: flex; align-items: center; padding: 0 1.5rem; position: sticky; top: 0; z-index: 1000; box-sizing: border-box; }
    .hero-shell { position: relative; height: calc(100vh - 75px); height: calc(100dvh - 75px); min-height: 480px; width: 100%; overflow: hidden; background: #020617; }
    .hero-picture { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
    .hero-image { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
    .hero-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 1; }
    .hero-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; text-align: center; color: #fff; width: 100%; padding: 0 1rem; box-sizing: border-box; }
    .hero-shell .hero-title { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(2.35rem, 5.5vw, 4.25rem); font-weight: 700; margin: 0 0 0.5rem 0; line-height: 1.15; letter-spacing: -0.02em; text-shadow: 0 4px 16px rgba(0, 0, 0, 0.45); }
    .hero-buttons { display: flex; gap: 0.75rem; justify-content: center; margin-top: 1rem; flex-wrap: wrap; }
    .hero-btn-shell { display: inline-flex; align-items: center; justify-content: center; padding: 0.85rem 2rem; border-radius: 9999px; font-size: 0.95rem; font-weight: 600; font-family: 'Inter', sans-serif; text-decoration: none; }
    .hero-btn-shell.primary { background: #B84E29; color: #fff; box-shadow: 0 4px 16px rgba(184, 78, 41, 0.35); }
    .hero-btn-shell.secondary { background: rgba(255, 255, 255, 0.15); color: #fff; border: 1px solid rgba(255, 255, 255, 0.4); backdrop-filter: blur(8px); }
    @media (max-width: 576px) {
      .header-shell { height: 65px; padding: 0 1rem; }
      .header-shell img { height: 44px !important; max-width: 110px !important; }
      .hero-shell { height: calc(100vh - 65px); height: calc(100dvh - 65px); }
      .hero-buttons { flex-direction: column; gap: 0.5rem; align-items: center; }
      .hero-btn-shell { width: 85%; max-width: 260px; padding: 0.75rem 1.5rem; font-size: 0.9rem; }
    }
  </style>

  <!-- Optimized non-render-blocking fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&amp;family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Bengali:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700;800&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"></noscript>
  
  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Store",
    "name": "Karukolpo",
    "image": "https://karukolpo.com/assets/logo.webp",
    "@id": "https://karukolpo.com",
    "url": "https://karukolpo.com",
    "telephone": "+880XXXXXXXXXX",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Tangail, Bangladesh",
      "addressLocality": "Tangail",
      "addressRegion": "Dhaka",
      "postalCode": "1900",
      "addressCountry": "BD"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 24.2513,
      "longitude": 89.9231
    },
    "openingHoursSpecification": {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday"
      ],
      "opens": "00:00",
      "closes": "23:59"
    },
    "sameAs": [
      "https://www.facebook.com/karukolpo",
      "https://www.instagram.com/karukolpobd"
    ]
  }
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Karukolpo">
</head>

<body>
  <!-- Static hero shell: painted IMMEDIATELY by the browser, before Angular bootstraps.
       This eliminates the 3.5s Element Render Delay on the LCP image. 
       Angular will replace this content when it mounts. -->
  <app-root>
    <!-- Header Shell matching real header dimensions & logo -->
    <div class="header-shell">
      <img src="assets/header-logo.webp" alt="Karukolpo" width="140" height="52" style="height: 52px; width: auto; max-width: 140px; object-fit: contain; display: block;">
    </div>

    <!-- Hero Shell matching real hero layout & typography -->
    <div class="hero-shell">
      <picture class="hero-picture">
        <source media="(max-width: 768px)" srcset="assets/hero-banner-mobile.webp" type="image/webp">
        <img src="assets/hero-banner.webp" class="hero-image" alt="Karukolpo Official Hero Banner" fetchpriority="high" decoding="async" loading="eager">
      </picture>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1 class="hero-title">Made by Hand.<br>Rooted in Bangladesh.</h1>
        <div class="hero-buttons">
          <span class="hero-btn-shell primary">Explore Collection</span>
          <span class="hero-btn-shell secondary">Our Story</span>
        </div>
      </div>
    </div>
  </app-root>
</body>

</html>
