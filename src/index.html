<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Karukolpo | Authentic Bangladeshi Handcrafts</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script>
    // Prevent browser PWA install pop-ups automatically
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-beforeinstallprompt', { detail: e }));
    });
  </script>
  <meta name="description" content="Discover Karukolpo: Premium Bangladeshi handcrafted heritage products, home decor, and authentic artisan creations. Support local craftsmen and find unique gifts.">
  <meta name="keywords" content="handicrafts, Bangladesh crafts, home decor, artisan products, handmade jewelry, Karukolpo, traditional crafts">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://karukolpo.com/">
  <meta property="og:title" content="Karukolpo | Authentic Bangladeshi Handcrafts">
  <meta property="og:description" content="Premium Bangladeshi handcrafted products and heritage-inspired home decor.">
  <meta property="og:image" content="https://karukolpo.com/assets/hero-banner.webp">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://karukolpo.com/">
  <meta property="twitter:title" content="Karukolpo | Authentic Bangladeshi Handcrafts">
  <meta property="twitter:description" content="Premium Bangladeshi handcrafted products and heritage-inspired home decor.">
  <meta property="twitter:image" content="https://karukolpo.com/assets/hero-banner.webp">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://karukolpo.com/"/>

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">

  <!-- Preload Critical Hero Asset (Desktop & Mobile) -->
  <link rel="preload" as="image" href="assets/hero-banner.webp" type="image/webp" media="(min-width: 769px)" fetchpriority="high">
  <link rel="preload" as="image" href="assets/hero-banner-mobile.webp" type="image/webp" media="(max-width: 768px)" fetchpriority="high">

  <!-- Inline Critical CSS: Zero-flicker shell -->
  <style>
    :root { --accent-color: #B84E29; --surface-card: #FFFFFF; }
    body { margin: 0; background: #FAF7F2; font-family: 'Inter', 'Hind Siliguri', sans-serif; }
    .header-shell { height: 80px; background: #FFFFFF; border-bottom: 1px solid #ECE7E0; display: flex; align-items: center; padding: 0 1rem; position: sticky; top: 0; z-index: 1000; }
    .hero-shell { position: relative; height: calc(100vh - 80px); height: calc(100dvh - 80px); min-height: 480px; width: 100%; overflow: hidden; background: #FAF7F2; }
    .hero-picture { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
    .hero-image { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
    .hero-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.35); z-index: 1; }
    .hero-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 2; text-align: center; color: #fff; width: 100%; padding: 0 1rem; box-sizing: border-box; }
    .hero-title { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 800; margin: 0; line-height: 1.1; font-family: 'Playfair Display', serif; }
    .hero-tag { font-size: clamp(1rem, 3vw, 1.25rem); margin-top: 1rem; opacity: 0.9; }
  </style>

  <!-- Non-render-blocking fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&amp;family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&amp;family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet"></noscript>
  
  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Store",
    "name": "Karukolpo",
    "image": "https://karukolpo.com/assets/logo.webp",
    "@id": "https://karukolpo.com",
    "url": "https://karukolpo.com",
    "telephone": "+880XXXXXXXXXX",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Tangail, Bangladesh",
      "addressLocality": "Tangail",
      "addressRegion": "Dhaka",
      "postalCode": "1900",
      "addressCountry": "BD"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 24.2513,
      "longitude": 89.9231
    },
    "openingHoursSpecification": {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday"
      ],
      "opens": "00:00",
      "closes": "23:59"
    },
    "sameAs": [
      "https://www.facebook.com/karukolpo",
      "https://www.instagram.com/karukolpobd"
    ]
  }
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Karukolpo">
</head>

<body>
  <!-- Static hero shell: painted IMMEDIATELY by the browser, before Angular bootstraps.
       This eliminates the 3.5s Element Render Delay on the LCP image. 
       Angular will replace this content when it mounts. -->
  <app-root>
    <!-- Header Shell -->
    <div class="header-shell">
      <img src="assets/logo.webp" alt="Karukolpo" width="80" height="80" style="object-fit: contain;">
    </div>

    <!-- Hero Shell -->
    <div class="hero-shell">
      <picture class="hero-picture">
        <source media="(max-width: 768px)" srcset="assets/hero-banner-mobile.webp" type="image/webp">
        <img src="assets/hero-banner.webp" class="hero-image" alt="Karukolpo Official Hero Banner" fetchpriority="high" decoding="async" loading="eager">
      </picture>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1 class="hero-title">Karukolpo</h1>
        <p class="hero-tag">Authentic Bangladeshi Handcrafts</p>
      </div>
    </div>
  </app-root>
</body>

</html>
